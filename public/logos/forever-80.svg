    <text transform="translate(239 90) scale(0.88 1)" text-anchor="middle" font-size="72" fill="#e9e9e9" letter-spacing="2">FOREVER 80</text>
    <rect x="97" y="120" width="286" height="338" fill="#ffffff" stroke="#c8c8c8" stroke-width="3"/>
